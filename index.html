<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fantasy Idle</title>
    <meta name="description" content="A painted idle RPG: fight, gather, craft and prestige, even while you are away.">
    <meta name="theme-color" content="#0d0a07">
    <!-- the icons and the install manifest come from tools/icons.py -->
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-title" content="Fantasy Idle">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="layout-sidebar">
        <aside id="sidebar" class="glass-panel">
            <h2 class="brand">Fantasy Idle</h2>
            <div id="nav-next"></div>
            <nav id="nav"></nav>
        </aside>
        <div id="main-content">
            <header id="header" class="glass-panel"></header>
            <div id="scene" hidden></div>
            <div id="stage" hidden></div>
            <main id="tab"></main>
        </div>
    </div>
    <div id="toast-area"></div>
    <div id="modal-root"></div>
    <script type="module" src="src/main.js"></script>
</body>
</html>
