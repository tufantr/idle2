# staging.fantasyidle.com: the private copy where each change is rehearsed before it goes live (deploy/vps/stage.sh;
# installed by deploy/vps/staging-setup.sh as /etc/nginx/sites-available/fantasyidle-staging, with the gate filled in).
# It answers only a browser that holds the gate's cookie, which the private link /__staging/<gate> sets once; anyone
# else gets a 404, and search engines are told to stay out. The gate lives only on the server, never in this file.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.fantasyidle.com;
    ssl_certificate /etc/ssl/fantasyidle/origin.pem;
    ssl_certificate_key /etc/ssl/fantasyidle/origin.key;
    root /srv/fantasyidle-staging/current/public;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/markdown;

    location = /__staging/__GATE__ {
        add_header Set-Cookie "fi_staging=__GATE__; Path=/; Max-Age=2592000; Secure; HttpOnly; SameSite=Lax" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 302 /;
    }
    location /api/ {
        if ($cookie_fi_staging != "__GATE__") { return 404; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 2m;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        if ($cookie_fi_staging != "__GATE__") { return 404; }
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ /\. { return 404; }
}
