# fantasyidle.com, behind Cloudflare (deploy/vps/; installed as /etc/nginx/sites-available/fantasyidle).
# Only Cloudflare reaches ports 80 and 443 (the firewall, deploy/vps/provision.sh), so the visitor's address it
# reports is trusted: conf.d/cloudflare-realip.conf makes it $remote_addr, and the API's login limits count it.
# Cloudflare talks to this server with its origin certificate (SSL mode "Full (strict)", deploy/vps/cloudflare.sh).
# Every file is checked again on each visit (the game's ES modules keep their names), as on Vercel.

# (Ubuntu's nginx.conf turns gzip on; what it compresses, and for Cloudflare's proxied requests too)
gzip_comp_level 5;
gzip_proxied any;
gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

# anything else, the bare address among it, gets nothing
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    ssl_certificate /etc/ssl/fantasyidle/origin.pem;
    ssl_certificate_key /etc/ssl/fantasyidle/origin.key;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name fantasyidle.com www.fantasyidle.com wiki.fantasyidle.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.fantasyidle.com;
    ssl_certificate /etc/ssl/fantasyidle/origin.pem;
    ssl_certificate_key /etc/ssl/fantasyidle/origin.key;
    return 301 https://fantasyidle.com$request_uri;
}

# the game: its files (the release's public/), and /api/ to the API (deploy/vps/server.cjs)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fantasyidle.com;
    ssl_certificate /etc/ssl/fantasyidle/origin.pem;
    ssl_certificate_key /etc/ssl/fantasyidle/origin.key;
    root /srv/fantasyidle/current/public;
    index index.html;
    charset utf-8;
    charset_types text/css application/javascript application/json text/markdown;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # the visitor, as Cloudflare reported it: never one they sent
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        client_max_body_size 2m;   # a save (the API takes up to 1 MB)
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
    location ~ /\. { return 404; }
}

# the wiki: its built pages under clean addresses (/clans for clans.html, no trailing slash), as on Vercel
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wiki.fantasyidle.com;
    ssl_certificate /etc/ssl/fantasyidle/origin.pem;
    ssl_certificate_key /etc/ssl/fantasyidle/origin.key;
    root /srv/fantasyidle/wiki/current;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    location = /skills/fishing { return 301 /skills/hunting; }   # Fishing joined Hunting (wiki/static/vercel.json)
    location = /404.html { internal; }   # (the error page itself, not the clean-address redirect below)
    location = /index.html { return 301 /; }
    location ~ ^/(.+)/$ { return 301 /$1; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }
    location / {
        try_files $uri $uri.html $uri/index.html =404;
        add_header Cache-Control "public, max-age=0, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
}
